<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Tinoschool — Espace Membres</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0a0a0a; --dark:#111; --card:#181818; --card2:#1f1f1f;
  --border:rgba(255,255,255,0.07); --yellow:#FFD000;
  --yellow-dim:rgba(255,208,0,0.15); --white:#f0f0f0;
  --muted:#666; --muted2:#444; --red:#ff4444; --green:#44cc88;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;font-weight:300;width:100%;min-height:100vh;overflow-x:hidden}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:100;background:var(--black);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0}
.splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,208,0,0.18) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(255,208,0,0.06) 0%,transparent 50%);pointer-events:none}
.splash-logo-wrap{position:relative;z-index:1;text-align:center;margin-bottom:48px;animation:fadeDown .7s ease both}
.splash-sub{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.splash-form{position:relative;z-index:1;width:calc(100% - 48px);max-width:340px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .7s .2s ease both}
.field-wrap{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.field-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;outline:none;transition:border-color .2s,box-shadow .2s}
.field-input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,208,0,.1)}
.field-input::placeholder{color:var(--muted2)}
.field-select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;outline:none;transition:border-color .2s;appearance:none;cursor:pointer}
.field-select:focus{border-color:var(--yellow)}
.btn-primary{background:var(--yellow);color:var(--black);border:none;border-radius:8px;padding:16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .15s,transform .1s;width:100%}
.btn-primary:active{transform:scale(.98);opacity:.9}
.splash-hint{margin-top:20px;font-size:12px;color:var(--muted);text-align:center;position:relative;z-index:1;animation:fadeUp .7s .3s ease both}
.splash-hint a{color:var(--yellow);text-decoration:none}

/* ── BADGE ROLE ── */
.role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.role-badge.membre{background:rgba(255,208,0,.12);color:var(--yellow)}
.role-badge.adherent{background:rgba(68,204,136,.12);color:var(--green)}
.role-badge.admin{background:rgba(255,68,68,.12);color:#ff6b6b}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;padding-bottom:86px}
.topbar{position:sticky;top:0;z-index:20;padding:48px 20px 16px;background:linear-gradient(to bottom,var(--black) 75%,transparent);display:flex;justify-content:space-between;align-items:flex-start}
.topbar-greeting{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.topbar-name{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;line-height:1}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-avatar{width:42px;height:42px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--black);cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:border-color .2s}
.topbar-avatar:hover{border-color:rgba(255,208,0,.5)}
.admin-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);display:none;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s}
.admin-btn:hover{background:rgba(255,68,68,.2)}
.admin-btn.show{display:flex}

/* ── PAGES ── */
.page{display:none;padding:0 16px;animation:slideUp .3s ease}
.page.active{display:block}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SECTION HEADERS ── */
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:22px;letter-spacing:.05em}

/* ── LOCKED OVERLAY ── */
.locked-section{position:relative}
.locked-overlay{position:absolute;inset:0;background:rgba(10,10,10,.92);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10;backdrop-filter:blur(4px)}
.lock-icon{font-size:40px}
.lock-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white)}
.lock-desc{font-size:13px;color:var(--muted);text-align:center;padding:0 20px;line-height:1.6}
.lock-badge{padding:6px 16px;border-radius:20px;background:rgba(255,208,0,.12);border:1px solid rgba(255,208,0,.3);color:var(--yellow);font-size:11px;letter-spacing:.15em;text-transform:uppercase}

/* ── CARDS ── */
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s}
.card:active{transform:scale(.98)}
.card:hover{border-color:rgba(255,208,0,.25)}

/* ── HOME ── */
.hero-banner{background:linear-gradient(135deg,rgba(255,208,0,.12) 0%,rgba(255,208,0,.04) 100%);border:1px solid rgba(255,208,0,.25);border-radius:16px;padding:22px;margin-bottom:24px;position:relative;overflow:hidden;cursor:pointer}
.hero-banner::before{content:'TS';position:absolute;right:-8px;bottom:-16px;font-family:'Bebas Neue',sans-serif;font-size:100px;letter-spacing:-2px;color:rgba(255,208,0,.06);pointer-events:none}
.hero-tag{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:8px;line-height:1.1}
.hero-meta{font-size:12px;color:var(--muted)}
.home-sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.home-sec-head h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.home-sec-head span{font-size:11px;color:var(--yellow);cursor:pointer}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.mini-event{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:160px;flex-shrink:0;cursor:pointer;transition:border-color .2s}
.mini-event:hover{border-color:rgba(255,208,0,.3)}
.mini-event-day{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--yellow)}
.mini-event-month{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.mini-event-name{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.3}
.mini-event-type{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--yellow)}
.mini-news{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.mini-news:hover{border-color:rgba(255,208,0,.25)}
.mini-news-cat{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}
.mini-news-title{font-size:15px;font-weight:500;line-height:1.3;margin-bottom:4px}
.mini-news-date{font-size:11px;color:var(--muted)}

/* ── VIDEOS ── */
.video-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.video-tabs::-webkit-scrollbar{display:none}
.vtab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:500;letter-spacing:.05em;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.vtab.active{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.video-grid{display:flex;flex-direction:column;gap:14px}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.video-card:hover{border-color:rgba(255,208,0,.3)}
.video-thumb{width:100%;position:relative;background:var(--card2);aspect-ratio:16/9;overflow:hidden}
.play-btn{width:52px;height:52px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--black);transition:transform .15s}
.video-card:hover .play-btn{transform:scale(1.1)}
.video-info{padding:14px 16px 16px}
.video-cat{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}
.video-title{font-size:15px;font-weight:500;margin-bottom:6px;line-height:1.3}
.video-meta{font-size:12px;color:var(--muted);display:flex;gap:12px}
.video-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200;flex-direction:column;justify-content:center;align-items:center}
.video-modal.open{display:flex}
.modal-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:201}
.modal-player{width:calc(100% - 32px);max-width:430px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.modal-player iframe{width:100%;height:100%;border:none}
.modal-info{width:calc(100% - 32px);max-width:430px;margin-top:16px}
.modal-title{font-size:16px;font-weight:500;margin-bottom:4px}
.modal-desc{font-size:13px;color:var(--muted)}

/* ── UPLOAD ── */
.upload-zone{border:2px dashed rgba(255,208,0,.35);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:24px;position:relative;background:rgba(255,208,0,.03)}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--yellow);background:rgba(255,208,0,.07)}
.upload-icon{font-size:40px;margin-bottom:10px;display:block}
.upload-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;margin-bottom:4px}
.upload-hint{font-size:12px;color:var(--muted);margin-bottom:14px}
.upload-formats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fmt-pill{padding:3px 10px;border-radius:20px;background:var(--card2);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.upload-progress-wrap{display:none;margin-bottom:20px}
.upload-progress-wrap.show{display:block}
.up-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.up-label span:last-child{color:var(--yellow)}
.progress-bar-bg{height:4px;background:var(--card2);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;width:0%;background:var(--yellow);border-radius:4px;transition:width .3s ease}
.my-videos-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.my-videos-header h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.my-videos-count{font-size:11px;color:var(--yellow)}
.my-vid-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.my-vid-thumb{width:100%;aspect-ratio:16/9;background:var(--card2);position:relative;cursor:pointer;overflow:hidden}
.my-vid-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.my-vid-overlay{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.my-vid-card:hover .my-vid-overlay{opacity:1}
.my-play-btn{width:52px;height:52px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--black)}
.my-vid-info{padding:12px 14px 14px;display:flex;gap:10px;align-items:flex-start}
.my-vid-text{flex:1;min-width:0}
.my-vid-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.my-vid-meta{font-size:11px;color:var(--muted)}
.my-vid-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.my-vid-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow-dim);color:var(--yellow)}
.my-vid-tag.cat-choregraphie{background:rgba(68,204,136,.12);color:var(--green)}
.my-vid-del{width:30px;height:30px;border-radius:8px;background:rgba(255,68,68,.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ff6b6b;flex-shrink:0;transition:background .15s}
.my-vid-del:hover{background:rgba(255,68,68,.2)}
.my-vid-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:200;flex-direction:column;justify-content:center;align-items:center}
.my-vid-modal.open{display:flex}
.my-modal-video{width:calc(100% - 32px);max-width:430px;border-radius:12px;overflow:hidden;background:#000}
.my-modal-video video{width:100%;display:block;max-height:70vh;object-fit:contain}
.my-modal-info{width:calc(100% - 32px);max-width:430px;margin-top:14px}
.my-modal-title{font-size:16px;font-weight:500;margin-bottom:4px}
.my-modal-sub{font-size:12px;color:var(--muted)}
.empty-state{text-align:center;padding:32px 20px;color:var(--muted)}
.empty-state .empty-ico{font-size:48px;margin-bottom:12px;display:block}
.empty-state p{font-size:13px;line-height:1.6}
.cat-btn{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;text-align:center}
.cat-btn.active{background:var(--yellow-dim);border-color:var(--yellow);color:var(--yellow);font-weight:600}

/* ── UPLOAD MODAL ── */
.upload-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;overflow-y:auto;padding:20px 0}
.upload-modal.open{display:flex;align-items:flex-start;justify-content:center}
.upload-modal-inner{width:calc(100% - 32px);max-width:430px;background:var(--dark);border-radius:20px;padding:24px;position:relative;margin-top:40px}

/* ── AGENDA ── */
.month-head{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);margin-bottom:14px;margin-top:4px}
.event-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;gap:16px;align-items:flex-start;cursor:pointer;transition:border-color .2s}
.event-row:hover{border-color:rgba(255,208,0,.3)}
.event-date{display:flex;flex-direction:column;align-items:center;min-width:38px}
.ev-day{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:var(--yellow)}
.ev-mo{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ev-sep{width:1px;background:var(--border);align-self:stretch;flex-shrink:0}
.ev-body{flex:1}
.ev-tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);margin-bottom:3px}
.ev-name{font-size:15px;font-weight:500;margin-bottom:6px}
.ev-details{display:flex;gap:12px;flex-wrap:wrap}
.ev-details span{font-size:12px;color:var(--muted)}
.ev-badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow-dim);color:var(--yellow)}
.ev-badge.red{background:rgba(255,68,68,.1);color:var(--red)}
.gcal-banner{background:linear-gradient(135deg,rgba(66,133,244,.15),rgba(66,133,244,.05));border:1px solid rgba(66,133,244,.25);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center}
.gcal-icon{font-size:24px;flex-shrink:0}
.gcal-text{flex:1}
.gcal-text p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px}
.gcal-text h4{font-size:14px;font-weight:500;color:var(--white)}

/* ── NEWS ── */
.news-big{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
.news-big:hover{border-color:rgba(255,208,0,.25)}
.news-banner{height:110px;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;overflow:hidden}
.news-banner-bg{position:absolute;inset:0}
.news-banner-emoji{position:relative;z-index:1}
.news-body-pad{padding:16px 18px 20px}
.news-cat{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--yellow);margin-bottom:5px}
.news-ttl{font-size:17px;font-weight:500;line-height:1.3;margin-bottom:8px}
.news-excerpt{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.news-dt{font-size:11px;color:var(--muted2)}
.notif-banner{background:linear-gradient(135deg,rgba(255,208,0,.1),rgba(255,208,0,.04));border:1px solid rgba(255,208,0,.2);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center}
.notif-banner span{flex:1;font-size:13px;color:var(--muted);line-height:1.5}
.notif-badge{width:36px;height:36px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* ── MUSIQUE ── */
.playlist-card{background:linear-gradient(135deg,rgba(255,208,0,.12),rgba(255,208,0,.04));border:1px solid rgba(255,208,0,.2);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:22px}
.playlist-art{width:56px;height:56px;border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.playlist-info h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:3px}
.playlist-info p{font-size:12px;color:var(--muted)}
.track-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .2s,border-color .2s}
.track-row:hover,.track-row.playing{background:rgba(255,208,0,.07);border-color:rgba(255,208,0,.25)}
.tr-num{font-size:13px;color:var(--muted);min-width:18px;text-align:center}
.track-row.playing .tr-num{color:var(--yellow)}
.tr-disc{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.track-row.playing .tr-disc{background:var(--yellow);animation:spin 3s linear infinite}
.tr-info{flex:1;min-width:0}
.tr-name{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-row.playing .tr-name{color:var(--yellow)}
.tr-style{font-size:11px;color:var(--muted);margin-top:1px}
.tr-dur{font-size:12px;color:var(--muted);flex-shrink:0}
.mini-player{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:440px;background:#222;border-radius:14px;padding:11px 14px;display:none;align-items:center;gap:12px;z-index:25;border:1px solid rgba(255,208,0,.2);box-shadow:0 8px 40px rgba(0,0,0,.7)}
.mini-player.on{display:flex}
.mini-disc{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;animation:spin 3s linear infinite}
.mini-text{flex:1;min-width:0}
.mini-trk{font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sty{font-size:11px;color:var(--muted)}
.mini-stop{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--black);flex-shrink:0;transition:transform .1s}
.mini-stop:active{transform:scale(.95)}

/* ── PROFIL ── */
.profile-top{display:flex;flex-direction:column;align-items:center;padding:20px 0 28px;text-align:center}
.profile-ava{width:76px;height:76px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--black);margin-bottom:14px;border:3px solid rgba(255,208,0,.3)}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;margin-bottom:6px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:12px;overflow:hidden;margin-bottom:22px}
.stat{background:var(--card);padding:16px 8px;text-align:center}
.stat-val{display:block;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:var(--yellow)}
.stat-lbl{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.menu-row{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.menu-row:hover{border-color:rgba(255,208,0,.2)}
.menu-ico{width:34px;height:34px;border-radius:8px;background:var(--yellow-dim);display:flex;align-items:center;justify-content:center;font-size:15px}
.menu-lbl{flex:1;font-size:14px;font-weight:400}
.menu-arr{color:var(--muted);font-size:14px}
.btn-deconnect{width:100%;margin-top:14px;padding:15px;background:transparent;border:1px solid rgba(255,68,68,.25);border-radius:10px;color:#ff6b6b;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:.1em;cursor:pointer;transition:background .2s}
.btn-deconnect:hover{background:rgba(255,68,68,.07)}
.social-row{display:flex;gap:10px;margin-bottom:20px}
.social-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
.social-btn:hover{border-color:rgba(255,208,0,.3);color:var(--yellow)}

/* ── ADMIN PANEL ── */
#page-admin{display:none;padding:0 16px;animation:slideUp .3s ease}
#page-admin.active{display:block}
.admin-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:16px;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);border-radius:12px}
.admin-header-icon{font-size:28px}
.admin-header h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#ff6b6b}
.admin-header p{font-size:12px;color:var(--muted);margin-top:2px}
.admin-section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--white);margin-bottom:14px;margin-top:8px}
.member-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.member-ava{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--black);flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-size:14px;font-weight:500;margin-bottom:2px}
.member-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-select{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer}
.role-select:focus{border-color:var(--yellow)}
.notif-compose{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.notif-compose textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;resize:none;outline:none;min-height:100px;transition:border-color .2s;margin-top:8px}
.notif-compose textarea:focus{border-color:var(--yellow)}
.notif-compose textarea::placeholder{color:var(--muted2)}
.notif-targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;margin-bottom:16px}
.target-chip{padding:6px 14px;border-radius:20px;font-size:11px;letter-spacing:.1em;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.target-chip.active{background:var(--yellow-dim);border-color:var(--yellow);color:var(--yellow)}
.sent-notif-row{display:flex;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.sent-notif-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;margin-top:5px}
.sent-notif-body{flex:1}
.sent-notif-msg{font-size:13px;margin-bottom:4px;line-height:1.5}
.sent-notif-meta{font-size:11px;color:var(--muted)}

/* ── NOTIFICATIONS BADGE ── */
.notif-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.notif-row.unread{border-color:rgba(255,208,0,.3);background:rgba(255,208,0,.04)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;margin-top:5px}
.notif-dot.read{background:var(--muted2)}
.notif-content{flex:1}
.notif-text{font-size:13px;line-height:1.5;margin-bottom:4px}
.notif-time{font-size:11px;color:var(--muted)}
.notif-badge-count{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);font-size:9px;color:#fff;display:none;align-items:center;justify-content:center;font-weight:600}
.notif-badge-count.show{display:flex}
.topbar-notif{position:relative;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:border-color .15s}
.topbar-notif:hover{border-color:rgba(255,208,0,.3)}

/* ── NAV ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,10,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0 22px;z-index:30;flex-direction:row}
.bottom-nav.show{display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .15s}
.nav-btn.active{color:var(--yellow)}
.nav-ico{font-size:20px;line-height:1}
.nav-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.nav-pip{width:4px;height:4px;border-radius:50%;background:var(--yellow);opacity:0;margin-top:1px}
.nav-btn.active .nav-pip{opacity:1}
.fab{position:fixed;bottom:86px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--yellow);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:22px;color:var(--black);z-index:24;box-shadow:0 4px 20px rgba(255,208,0,.4);transition:transform .15s}
.fab.show{display:flex}
.fab:active{transform:scale(.95)}
@media(min-width:600px){.bottom-nav{padding:8px 0 10px}#app{padding-bottom:60px}.mini-player{bottom:56px}}
.sep{height:1px;background:var(--border);margin:20px 0}
.mt{margin-top:20px}

/* Logo Tinoschool — chargé une seule fois */
.tino-logo {
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 20px rgba(255,208,0,.5));
}
#tino-logo-1 { height: 110px; }
#tino-logo-2 { height: 90px; }
#tino-logo-3 { height: 90px; }
</style>
</head>

<div id="splash">
  <div class="splash-bg"></div>
  <div class="splash-logo-wrap">
    <img id="tino-logo-1" class="tino-logo" alt="Tinoschool">
    <div class="splash-sub">École de danse Hip-Hop · Île-de-France</div>
  </div>
  <div class="splash-form">
    <div class="field-wrap">
      <div class="field-label">Adresse e-mail</div>
      <input class="field-input" type="email" id="f-email" placeholder="prenom@exemple.fr">
    </div>
    <div class="field-wrap">

      <input class="field-input" type="password" id="f-pwd" placeholder="••••••••">

</div>

  <!-- HOME -->

  <div class="my-modal-info"><div class="my-modal-title" id="my-modal-title"></div><div class="my-modal-sub" id="my-modal-sub"></div></div>
</div>

<!-- MODAL UPLOAD STRUCTURÉ -->
<div class="upload-modal" id="upload-modal">
  <div class="upload-modal-inner">
    <button class="modal-close" style="position:absolute;top:16px;right:16px" onclick="closeUploadModal()">✕</button>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:20px;text-align:center">📹 Nouvelle vidéo</div>
    <!-- Catégorie -->
    <div class="field-wrap" style="margin-bottom:16px">
      <div class="field-label">Catégorie *</div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="cat-btn active" id="cat-freestyle" onclick="selectCat('freestyle')">🕺 Freestyle</button>
        <button class="cat-btn" id="cat-choregraphie" onclick="selectCat('choregraphie')">💃 Chorégraphie</button>
      </div>
    </div>
    <!-- Nom du cours -->
    <div class="field-wrap" style="margin-bottom:14px">
      <div class="field-label">Nom du cours *</div>
      <select class="field-select" id="up-cours" style="margin-top:6px">
        <option value="">— Choisir le cours —</option>
        <option>Hip-Hop Enfants 6–7 ans</option>
        <option>Hip-Hop 8–12 ans</option>
        <option>Hip-Hop Ados</option>
        <option>Hip-Hop Adultes</option>
        <option>House Dance</option>
        <option>Afro Dance</option>
        <option>Freestyle / Battle</option>
        <option>Break / Bboy</option>
        <option>Locking</option>
        <option>Popping</option>
        <option>Jazz Rock</option>
      </select>
    </div>
    <!-- Champs Freestyle -->
    <div id="fields-freestyle">
      <div class="field-wrap" style="margin-bottom:14px">
        <div class="field-label">Nom de l'élève *</div>
        <input class="field-input" id="up-eleve" type="text" placeholder="Prénom Nom" style="margin-top:6px">
      </div>
      <div class="field-wrap" style="margin-bottom:14px">
        <div class="field-label">Année</div>
        <select class="field-select" id="up-annee" style="margin-top:6px">
          <option value="">— Année —</option>
          <option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option>
        </select>
      </div>
    </div>
    <!-- Champs Chorégraphie -->
    <div id="fields-choregraphie" style="display:none">
      <div class="field-wrap" style="margin-bottom:14px">
        <div class="field-label">Nom de la chorégraphie *</div>
        <select class="field-select" id="up-choree" style="margin-top:6px">
          <option value="">— Choisir la chorée —</option>
          <option>Ouverture — Ensemble</option>
          <option>Chorée Enfants Gala 2026</option>
          <option>Showcase Ados 2026</option>
          <option>Freestyle Adultes 2026</option>
          <option>Locking Solo 2026</option>
          <option>Finale — Tous niveaux</option>
          <option>Battle Tinoschool Week</option>
        </select>
      </div>
    </div>
    <!-- Fichier -->
    <div class="field-wrap" style="margin-bottom:20px">
      <div class="field-label">Fichier vidéo *</div>
      <div class="upload-zone" style="padding:16px;margin-top:6px;margin-bottom:0;position:relative">
        <input type="file" accept="video/*" id="video-file-input"
               style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%"
               onchange="previewFile(this.files[0])">
        <div id="file-preview" style="text-align:center">
          <span style="font-size:24px">📁</span>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">Appuyer pour choisir</div>
        </div>
      </div>
    </div>
    <button class="btn-primary" onclick="submitUpload()">Téléverser la vidéo</button>
    <div id="upload-err" style="color:#ff6b6b;font-size:12px;text-align:center;margin-top:10px;display:none"></div>
  </div>
</div>

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  if (!el) return;
  el.innerHTML = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 6000);
}

function login() {
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  if (!email) { showLoginError('Entre ton adresse e-mail.'); return; }

  if (BETA_MODE && !BETA_WHITELIST.map(e => e.toLowerCase()).includes(email)) {
    showLoginError("⛔ Accès restreint — L'app est en phase de test.<br>Contacte l'équipe Tinoschool pour obtenir l'accès.");
    return;
  }

  let found = members.find(m => m.email.toLowerCase() === email);
  if (!found) {
    const part  = email.split('@')[0];
    const words = part.split(/[\.\-_]/);
    const name  = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const initials = words.map(w => w.charAt(0).toUpperCase()).join('').slice(0,2);
    found = { id: Date.now(), name, email, initials, role: 'membre' };
    members.push(found);
  }
  currentUser = found;
  launchApp();
}

function launchApp() {

/* Détection iFrame Wix */
function checkIframeMode() {
  try {
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name'), role = params.get('role') || 'membre';
    if (name) {
      const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      currentUser = {id:Date.now(),name,initials,role,email:''};
      launchApp();
      return;
    }
  } catch(e) {}
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'TINO_LOGIN') {
      currentUser = {
        id: Date.now(),
        name: e.data.name || 'Danseur',
        initials: (e.data.initials || e.data.name.slice(0,2)).toUpperCase(),
        role: e.data.role || 'membre',
        email: e.data.email || ''
      };
      launchApp();
    }
  });
}
document.addEventListener('DOMContentLoaded', checkIframeMode);

function submitUpload() {
  const err = document.getElementById('upload-err');
  err.style.display = 'none';
  const cours = document.getElementById('up-cours').value;
  if (!cours) { showErr('Choisis un cours.'); return; }
  if (currentCat === 'freestyle' && !document.getElementById('up-eleve').value.trim()) {
    showErr('Indique le nom de l\'élève.'); return;
  }
  if (currentCat === 'choregraphie' && !document.getElementById('up-choree').value) {
    showErr('Choisis la chorégraphie.'); return;
  }
  if (!selectedFile) { showErr('Sélectionne un fichier vidéo.'); return; }
  closeUploadModal();
  processUpload(selectedFile, {
    cours,
    cat: currentCat,
    eleve: document.getElementById('up-eleve').value.trim(),
    annee: document.getElementById('up-annee').value,
    choree: document.getElementById('up-choree').value,
  });
}

function showErr(msg) {
  const el = document.getElementById('upload-err');
  el.textContent = msg; el.style.display = 'block';
}

function processUpload(file, meta) {
  const progress = document.getElementById('upload-progress');
  const fill = document.getElementById('progress-fill');
  const pct = document.getElementById('up-percent');
  const fname = document.getElementById('up-filename');
  progress.classList.add('show');
  fname.textContent = file.name;
  fill.style.width = '0%'; pct.textContent = '0%';
  let fake = 0;
  const interval = setInterval(() => {
    fake = Math.min(fake + Math.random()*12, 90);
    fill.style.width = fake + '%'; pct.textContent = Math.floor(fake) + '%';
  }, 120);
  const reader = new FileReader();
  reader.onload = e => {
    clearInterval(interval);
    fill.style.width = '100%'; pct.textContent = '100%';
    const name = meta.cat === 'choregraphie' ? meta.choree : (meta.eleve + ' — Freestyle');
    myVideos.unshift({
      id: Date.now(), name,
      url: e.target.result,
      date: new Date().toLocaleDateString('fr-FR'),
      size: formatSize(file.size),
      cat: meta.cat,
      cours: meta.cours,
      eleve: meta.eleve || '',
      annee: meta.annee || '',
      choree: meta.choree || '',
    });
    setTimeout(() => { progress.classList.remove('show'); renderMyVideos(); }, 500);
    // Afficher filtres
    document.getElementById('my-vid-filters').style.display = 'flex';
  };
  reader.readAsDataURL(file);
}

function formatSize(bytes) {
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' Ko';
  return (bytes/(1024*1024)).toFixed(1) + ' Mo';
}

/* ════════════════════════════════
   GOOGLE CALENDAR
════════════════════════════════ */
async function loadGoogleCalendar() {
  const agendaEl = document.getElementById('agenda-events');
  if (!agendaEl) return;

  // Affiche un loader pendant le chargement
  agendaEl.innerHTML = `
    <div style="text-align:center;padding:32px;color:var(--muted)">
      <div style="font-size:32px;margin-bottom:8px">📅</div>
      <div style="font-size:13px">Chargement de l'agenda…</div>
    </div>`;

  try {
    const now    = new Date().toISOString();
    const future = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toISOString(); // +90 jours
    const url    = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CONFIG.GOOGLE_CALENDAR_ID)}/events`
      + `?key=${CONFIG.GOOGLE_CALENDAR_API_KEY}`
      + `&timeMin=${now}&timeMax=${future}`
      + `&singleEvents=true&orderBy=startTime&maxResults=20`;

    const res  = await fetch(url);
    const data = await res.json();

    if (data.error) throw new Error(data.error.message);
    if (!data.items || data.items.length === 0) {
      agendaEl.innerHTML = `<div class="empty-state"><span class="empty-ico">📅</span><p>Aucun événement à venir.</p></div>`;
      return;
    }

    // Groupe par mois
    const byMonth = {};
    data.items.forEach(ev => {
      const start  = new Date(ev.start.dateTime || ev.start.date);
      const key    = start.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });
      if (!byMonth[key]) byMonth[key] = [];
      byMonth[key].push({ ev, start });
    });

    let html = '';
    for (const [month, evts] of Object.entries(byMonth)) {
      html += `<div class="month-head">${month.toUpperCase()}</div>`;
      evts.forEach(({ ev, start }) => {
        const day   = start.getDate().toString().padStart(2,'0');
        const mo    = start.toLocaleString('fr-FR', { month: 'short' }).toUpperCase();
        const heure = ev.start.dateTime
          ? start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
          : 'Toute la journée';
        const lieu  = ev.location ? `<span>📍 ${ev.location}</span>` : '';
        const desc  = ev.description ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">${ev.description}</div>` : '';
        html += `
          <div class="event-row">
            <div class="event-date"><div class="ev-day">${day}</div><div class="ev-mo">${mo}</div></div>
            <div class="ev-sep"></div>
            <div class="ev-body">
              <div class="ev-tag">Tinoschool</div>
              <div class="ev-name">${ev.summary || 'Événement'}</div>
              <div class="ev-details"><span>🕐 ${heure}</span>${lieu}</div>
              ${desc}
            </div>
          </div>`;
      });
    }
    agendaEl.innerHTML = html;

  } catch (err) {
    console.error('Google Calendar error:', err);
    // Fallback : affiche l'agenda statique si l'API échoue
    agendaEl.innerHTML = `
      <div style="background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#ff8080">
        ⚠️ Impossible de charger le calendrier en ligne. Vérifie que la clé API est bien renseignée et que le calendrier est public.
      </div>
      ${agendaStatique()}`;
  }
}

/* ════════════════════════════════
   NOTIFICATIONS IN-APP
════════════════════════════════ */
function renderNotifs() {
  const list = document.getElementById('notifs-list');
  if (notifications.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-ico">🔔</span><p>Aucune notification pour l\'instant.</p></div>';
    return;
  }
  list.innerHTML = notifications.map(n => `
    <div class="notif-row ${n.read ? '' : 'unread'}">
      <div class="notif-dot ${n.read ? 'read' : ''}"></div>
      <div class="notif-content">
        <div class="notif-text">${n.msg}</div>
        <div class="notif-time">${n.time} · De l'équipe Tinoschool</div>
      </div>
    </div>`).join('');
  updateNotifBadge();
}

function markNotifsRead() {
  notifications.forEach(n => n.read = true);
  updateNotifBadge();
  renderNotifs();
}

function updateNotifBadge() {
  const unread = notifications.filter(n => !n.read).length;
  const badge  = document.getElementById('notif-count');
  badge.textContent = unread;
  badge.classList.toggle('show', unread > 0);
}

   ADMIN
════════════════════════════════ */
function renderAdminMembers() {
  const list = document.getElementById('admin-members-list');
  list.innerHTML = members.map(m => `
    <div class="member-row">
      <div class="member-ava">${m.initials}</div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-email">${m.email}</div>
      </div>
      <select class="role-select" onchange="changeRole(${m.id}, this.value)">
        <option value="membre"   ${m.role==='membre'   ?'selected':''}>Membre</option>
        <option value="adherent" ${m.role==='adherent' ?'selected':''}>Adhérent</option>
        <option value="admin"    ${m.role==='admin'    ?'selected':''}>Admin</option>
      </select>
    </div>`).join('');
}

function changeRole(id, role) {
  const m = members.find(m => m.id === id);
  if (!m) return;
  m.role = role;
  if (currentUser && currentUser.id === id) { currentUser.role = role; applyLocks(); }
  if (currentUser && currentUser.role === 'admin') renderAdminMembers();
}

/* ── ENVOI NOTIFICATION : in-app + email Brevo ── */
async function sendNotification() {
  const msg = document.getElementById('notif-msg').value.trim();
  if (!msg) { alert('Écris un message avant d\'envoyer.'); return; }

  const activeTarget = document.querySelector('.target-chip.active');
  const target       = activeTarget ? activeTarget.dataset.target : 'all';
  const time         = new Date().toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const recipients   = getRecipients(target);

  // 1. Ajout in-app (visible immédiatement)
  notifications.unshift({ msg, target, time, read: false });
  sentNotifications.unshift({ msg, target, time, recipients: recipients.length });
  renderSentNotifs();
  updateNotifBadge();

  // 2. Envoi email via Brevo
  const sendBtn = document.querySelector('#page-admin .btn-primary');
  sendBtn.textContent = '⏳ Envoi en cours…';
  sendBtn.disabled = true;

  try {
    await sendBrevoEmail(msg, recipients, target);
    document.getElementById('notif-msg').value = '';
    alert(`✅ Notification envoyée !\n📧 ${recipients.length} email(s) envoyé(s).`);
  } catch (err) {
    console.error('Brevo error:', err);
    alert(`✅ Notification in-app envoyée.\n⚠️ Email non envoyé : ${err.message}\n\nVérifie ta clé Brevo.`);
  } finally {
    sendBtn.textContent = '📤 Envoyer';
    sendBtn.disabled = false;
  }
}

async function sendBrevoEmail(msg, recipients, target) {
  if (recipients.length === 0) return;

  const targetLabels = { all: 'Tous les membres', adherent: 'Adhérents', membre: 'Membres' };

  // Brevo : envoi en masse via "to" (jusqu'à 50 destinataires par appel)
  const res = await fetch('https://api.brevo.com/v3/smtp/email', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'api-key': CONFIG.BREVO_API_KEY,
    },
    body: JSON.stringify({
      sender: {
        name:  CONFIG.BREVO_SENDER_NAME,
        email: CONFIG.BREVO_SENDER_EMAIL,
      },
      to: recipients.map(r => ({ email: r.email, name: r.name })),
      subject: `📢 Message de Tinoschool — ${new Date().toLocaleDateString('fr-FR')}`,
      htmlContent: `
        <div style="background:#0a0a0a;padding:40px 20px;font-family:sans-serif;max-width:600px;margin:0 auto">
          <img id="tino-logo-1" class="tino-logo" alt="Tinoschool">
          <div style="background:#181818;border-radius:12px;padding:28px;border:1px solid rgba(255,255,255,0.07)">
            <p style="color:#FFD000;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">
              MESSAGE DE L'ÉCOLE
            </p>
            <p style="color:#f0f0f0;font-size:16px;line-height:1.7;margin:0">${msg.replace(/\n/g,'<br>')}</p>
          </div>
          <p style="color:#666;font-size:12px;margin-top:24px;text-align:center">
            Destinataires : ${targetLabels[target] || 'Tous'}<br>
            Tinoschool · Yin Yang Assoc' · 93290 Tremblay-en-France<br>
            <a href="https://www.tinoschool.com" style="color:#FFD000">www.tinoschool.com</a>
          </p>
        </div>`,
    }),
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || `Erreur HTTP ${res.status}`);
  }
}

function renderSentNotifs() {
  const list = document.getElementById('sent-notifs-list');
  if (sentNotifications.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-ico" style="font-size:32px">📭</span><p>Aucune notification envoyée.</p></div>';
    return;
  }
  const targetLabels = { all:'Tous', adherent:'Adhérents', membre:'Membres' };
  list.innerHTML = sentNotifications.map(n => `
    <div class="sent-notif-row">
      <div class="sent-notif-dot"></div>
      <div class="sent-notif-body">
        <div class="sent-notif-msg">${n.msg}</div>
        <div class="sent-notif-meta">${n.time} · ${targetLabels[n.target]||'Tous'} · 📧 ${n.recipients || 0} email(s)</div>
      </div>
    </div>`).join('');
}
